<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Egypt's Digital Museum</title>
  <link rel="stylesheet" href="css/common.css">
  <script src="js/theme.js"></script>  
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>
  <header id="header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/images/image-removebg-preview.png" alt="Egypt's Digital Museum">
      </a>
      <button class="menu-btn" id="menuBtn" aria-expanded="false">☰</button>
            <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a  href="explore.html">Explore</a>
        <a href="people.html">People</a>
        <a href="collection.html">Collections</a>
        <a href="place.html">Places</a>
        <a href="timeline.html">Timeline</a>
        <a href="virtual-museum.html">Virtual Museum</a>
        <a href="learn.html">Learn</a>
        <!-- ADD THIS -->
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="icon-moon">🌙</span>
          <span class="icon-sun">☀️</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- ── LOGIN OVERLAY ── -->
  <div class="login-overlay" id="loginOverlay" style="display:flex;">
    <div class="login-box">
      <div class="login-logo">𓂀</div>
      <h2>Admin Access</h2>
      <p>Egypt's Digital Museum</p>

      <div class="login-field">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" placeholder="Enter username" autocomplete="username">
      </div>

      <div class="login-field">
        <label for="loginPass">Password</label>
        <div class="pass-wrap">
          <input type="password" id="loginPass" placeholder="Enter password" autocomplete="current-password">
          <button class="pass-toggle" type="button" onclick="togglePass()" aria-label="Toggle password visibility">👁</button>
        </div>
      </div>

      <div class="login-error" id="loginError"></div>

      <button class="login-btn" onclick="doLogin()">Sign In →</button>
    </div>
  </div>

  <div class="admin-hero">
    <div>
      <div class="eyebrow">Museum Management</div>
      <h1>Admin Panel</h1>
      <p>Add, edit and delete artifacts from the collection</p>
    </div>
  </div>

  <div class="admin-layout">

    <!-- LEFT: FORM -->
    <div class="form-card">
      <h2 id="formTitle">➕ Add New Artifact</h2>

      <input type="hidden" id="editId">

      <div class="field">
        <label for="title">Title *</label>
        <input type="text" id="title" placeholder="e.g. Great Sphinx of Giza" required>
      </div>

      <div class="field">
        <label for="category">Category *</label>
        <select id="category">
          <option value="">Select a category…</option>
          <option value="royal">Royalty & Elite</option>
          <option value="funerary">Funerary & Afterlife</option>
          <option value="religious">Religion & Ritual</option>
          <option value="everyday">Daily Life</option>
          <option value="writing">Writing & Documents</option>
          <option value="art">Art & Sculpture</option>
          <option value="monuments">Architecture & Monuments</option>
        </select>
      </div>

      <div class="field">
        <label for="date">Date / Period</label>
        <input type="text" id="date" placeholder="e.g. c. 2558 BCE">
      </div>

      <div class="field">
        <label for="period">Time Period *</label>
        <select id="period">
          <option value="">Select a time period…</option>
          <option value="predynastic">Predynastic (c. 6000–3100 BCE)</option>
          <option value="early-dynastic">Early Dynastic (c. 3100–2686 BCE)</option>
          <option value="old-kingdom">Old Kingdom (c. 2686–2181 BCE)</option>
          <option value="middle-kingdom">Middle Kingdom (c. 2055–1650 BCE)</option>
          <option value="new-kingdom">New Kingdom (c. 1550–1077 BCE)</option>
          <option value="late-period">Late Period (c. 664–332 BCE)</option>
          <option value="ptolemaic">Ptolemaic & Roman (332 BCE–395 CE)</option>
        </select>
      </div>

      <div class="field">
        <label for="description">Description *</label>
        <textarea id="description" placeholder="Describe the artifact…"></textarea>
      </div>

      <div class="field">
        <label for="imageUrl">Image URL *</label>
        <input type="url" id="imageUrl" placeholder="https://..." oninput="previewImage(this.value)">
        <img id="imgPreview" class="img-preview" alt="Preview">
      </div>

      <div class="field">
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g. British Museum, London">
      </div>

      <div class="field">
        <label for="dynasty">Dynasty / Period</label>
        <input type="text" id="dynasty" placeholder="e.g. 18th Dynasty">
      </div>

      <div class="form-actions">
        <button class="btn-submit" onclick="submitForm()">Save Artifact →</button>
        <button class="btn-clear" onclick="clearForm()">Clear</button>
      </div>

      <div class="toast" id="toast"></div>
    </div>

    <!-- RIGHT: LIST -->
    <div class="list-card">
      <div class="list-header">
        <h2>All Artifacts</h2>
        <span class="count-badge" id="countBadge">0</span>
      </div>

      <input class="search-box" type="text" placeholder="Search artifacts…" oninput="filterList(this.value)">

      <div class="artifact-list" id="artifactList">
        <div class="empty-list">Loading artifacts…</div>
      </div>
    </div>

  </div>

  <script src="js/admin.js"></script>

  <script>
    /* ── Admin credentials ── */
    const _u = atob("YWRtaW4=");       // admin
    const _p = atob("ZWd5cHQyMDI0");   // egypt2024

    const overlay = document.getElementById("loginOverlay");

    /* Already logged in this session? */
    if (sessionStorage.getItem("adminAuth") === "true") {
      overlay.style.display = "none";
    }

    function doLogin() {
      const user = document.getElementById("loginUser").value.trim();
      const pass = document.getElementById("loginPass").value;
      const err  = document.getElementById("loginError");

      if (!user || !pass) {
        err.textContent = "Please enter both fields.";
        return;
      }

      if (user === _u && pass === _p) {
        sessionStorage.setItem("adminAuth", "true");
        overlay.classList.add("fade-out");
        setTimeout(() => { overlay.style.display = "none"; }, 400);
      } else {
        err.textContent = "Incorrect username or password.";
        document.getElementById("loginPass").value = "";
        document.getElementById("loginPass").focus();
      }
    }

    function togglePass() {
      const inp = document.getElementById("loginPass");
      const btn = document.querySelector(".pass-toggle");
      if (inp.type === "password") {
        inp.type = "text";
        btn.textContent = "🙈";
      } else {
        inp.type = "password";
        btn.textContent = "👁";
      }
    }

    /* Enter key support */
    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && overlay.style.display !== "none") {
        doLogin();
      }
    });
  </script>
</body>
</html>
